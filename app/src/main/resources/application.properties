spring.application.name=back-end

#spring.datasource.url=jdbc:mysql://<mysql_host>/cms?usessl=false
spring.datasource.url=jdbc:mysql://localhost:3306/cms?useSSL=false
spring.datasource.username=root

#spring.datasource.password=<mysql_password>
spring.datasource.password=4321
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.separator=$$

#spring.data.mongodb.uri=mongodb://root:<mongodb_password>@<mongodb_host>:27017/prescriptions?authSource=admin"
spring.data.mongodb.uri=mongodb://localhost:27017/prescriptions

management.endpoint.health.show-details=always
management.health.db.enabled=true


api.path=/
jwt.secret=$!@#$^%$$$%####$DDCPN0234FCFDPD8670M


# -- statik varlıkları (örneğin, CSS, JS, görseller) nerede arayacağını belirtir.
spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
# -------------------------
# -- Thymeleaf şablonlarının bulunduğu klasör src/main/resources/templates/
spring.thymeleaf.prefix=classpath:/templates/
# -- Thymeleaf şablonlarının .html uzantısına sahip
spring.thymeleaf.suffix=.html
# --HTML5 sayfalarını render etmek için 
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false    
spring.thymeleaf.encoding=UTF-8